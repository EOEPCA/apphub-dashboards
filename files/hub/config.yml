profiles:
- config_maps: []
  default_url: null
  definition:
    default: false
    description: This profile is used to demonstrate a Panel dashboard (https://panel.holoviz.org/)
    display_name: Panel
    kubespawner_override:
      cpu_guarantee: 1
      cpu_limit: 2
      extra_resource_guarantees: {}
      extra_resource_limits: {}
      image: ghcr.io/eoepca/apphub-dashboards/panel:0.2.0
      mem_guarantee: 1G
      mem_limit: 2G
    slug: profile_panel
  env_from_config_maps: []
  env_from_secrets: []
  groups:
  - group-a
  - group-b
  id: profile_dash
  image_pull_secrets: []
  init_containers: []
  manifests: []
  node_selector: {}
  pod_env_vars:
    HOME: /workspace
  role_bindings: null
  secret_mounts: []
  volumes:
  - access_modes:
    - ReadWriteOnce
    claim_name: workspace-claim
    name: workspace-volume
    persist: true
    size: 10Gi
    storage_class: standard
    volume_mount:
      mount_path: /workspace
      name: workspace-volume
